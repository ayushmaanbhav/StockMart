<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        #log { background: #000; padding: 10px; height: 400px; overflow-y: auto; border: 1px solid #333; margin: 10px 0; }
        button { margin: 5px; padding: 10px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        input { padding: 5px; margin: 5px; background: #333; color: #fff; border: 1px solid #555; }
        .message { margin: 2px 0; padding: 2px; }
        .sent { color: #4CAF50; }
        .received { color: #2196F3; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <h1>StockMart WebSocket Test</h1>
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="auth()">Authenticate (User 1)</button>
        <button onclick="subscribe()">Subscribe AAPL</button>
    </div>
    <div>
        <input type="text" id="symbol" value="AAPL" placeholder="Symbol">
        <input type="number" id="price" value="150" placeholder="Price">
        <input type="number" id="qty" value="10" placeholder="Quantity">
        <button onclick="placeBuy()">Place Buy Order</button>
    </div>
    <div id="log"></div>

    <script>
        let ws = null;

        function log(message, className = '') {
            const logDiv = document.getElementById('log');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + className;
            msgDiv.textContent = new Date().toLocaleTimeString() + ': ' + message;
            logDiv.appendChild(msgDiv);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function connect() {
            if (ws) {
                log('Already connected', 'error');
                return;
            }
            ws = new WebSocket('ws://localhost:3000/ws');
            
            ws.onopen = () => {
                log('Connected to WebSocket', 'sent');
            };
            
            ws.onmessage = (event) => {
                log('Received: ' + event.data, 'received');
            };
            
            ws.onerror = (error) => {
                log('WebSocket error: ' + error, 'error');
            };
            
            ws.onclose = () => {
                log('Disconnected', 'error');
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function send(type, payload) {
            if (!ws) {
                log('Not connected!', 'error');
                return;
            }
            const message = JSON.stringify({ type, payload });
            ws.send(message);
            log('Sent: ' + message, 'sent');
        }

        function auth() {
            send('Auth', { token: '1' });
        }

        function subscribe() {
            send('Subscribe', { symbol: 'AAPL' });
        }

        function placeBuy() {
            const symbol = document.getElementById('symbol').value;
            const price = parseFloat(document.getElementById('price').value);
            const qty = parseInt(document.getElementById('qty').value);
            
            send('PlaceOrder', {
                symbol: symbol,
                side: 'Buy',
                order_type: 'Limit',
                qty: qty,
                price: Math.floor(price * 10000)  // Scale price
            });
        }
    </script>
</body>
</html>
